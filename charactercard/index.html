<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="charactercard.js" defer></script>
    <link rel="stylesheet" href="charactercard.css">
</head>
<body>
    <main id="main">
        <article id="character-card">
            <img id="character-photo" src="" alt="placeholder">
            <header class="character-card__header">
                <h1 id="character-name">none</h1>
            </header>
            <section class="character-card__details" aria-label="Character details">
                <ul>
                    <li><span>Class</span><span id="character-class">none</span></li>
                    <li><span>Level</span><span id="character-level">0</span></li>
                    <li><span>Health</span><span id="character-health">0</span></li>
                </ul>
            </section>
            <footer class="character-card-actions">
                <button id="level-up-button">Level Up</button>
                <button id="attack-button">Attack</button>
            </footer>
        </article>
    </main>
</body>
</html>
