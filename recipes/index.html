<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="recipes.css">
</head>
<body>
    <div class="header">
        <a href="index.html"><img src="bin/recipe-book.png" alt="logo"></a>
        <h1>RecipeBook</h1>
    </div>
    <div class="search">
        <b>Find a Recipe</b>
        <img src="bin/search.svg" alt="search icon">
    </div>
    <div class="bar"></div>
    <index class="recipes">
        <div class="recipe">
            <a href="recipe.html"><img src="bin/apple-crisp.jpg" alt="recipe image"></a>
            <p class="recipe-type">Dessert</p>
            <h2>Apple Crisp</h2>
            <p class="recipe-description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
            <span
            class="rating"
            role="img"
            aria-label="Rating: 4 out of 5 stars"
            >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
        </div>
    </index>
    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="bin/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="bin/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="bin/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>                   
</body>
</html>
