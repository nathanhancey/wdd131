<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="eventform.js" defer></script>
    <link rel="stylesheet" href="eventform.css">
</head>
<body>
    <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="fsyForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="travelRange">Type</label>
        <select
          id="travelRange"
          name="travelRange"
          aria-controls="notesContainer"
          required
        >
          <option value="">Choose one</option>
          <option value="one">Student</option>
          <option value="many">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="availableDate">Event Date</label>
        <input id="availableDate" name="availableDate" type="date" required />
      </div>

      <div id="notesContainer" class="field full" hidden>
        <label for="notes">Travel Notes</label>
        <input id="notes" name="notes" type="text" />
      </div>

      <button class="full" type="submit">Create Ticket</button>

        <div id="notesContainer" class="field full" hidden>
            <label for="notes">x</label>
            <input id="notes" name="notes" type="text" />
        </div>
    </form>

    <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>
